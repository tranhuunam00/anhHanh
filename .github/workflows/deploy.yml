name: Deploy on Commit

on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub

jobs:
  deploy:
    name: Auto Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Bắt đầu tự động cập nhật code mới lên Server..."
            
            # Tự động nhận diện thư mục dự án trên VPS (hỗ trợ cả /root/anhHanh, ~/anhHanh, SERVER_PATH)
            USER_INPUT_PATH="${{ secrets.SERVER_PATH || vars.SERVER_PATH }}"
            
            if [ -n "$USER_INPUT_PATH" ] && [ -d "$USER_INPUT_PATH" ]; then
              cd "$USER_INPUT_PATH"
            elif [ -d "/root/anhHanh" ]; then
              cd /root/anhHanh
            elif [ -d "$HOME/anhHanh" ]; then
              cd "$HOME/anhHanh"
            elif [ -d "/var/www/anhHanh" ]; then
              cd /var/www/anhHanh
            else
              DETECTED_DIR=$(find /root /home /var/www -maxdepth 2 -name "anhHanh" -type d 2>/dev/null | head -n 1)
              if [ -n "$DETECTED_DIR" ]; then
                cd "$DETECTED_DIR"
              else
                echo "❌ Lỗi: Không tìm thấy thư mục anhHanh trên VPS!"
                echo "Thư mục hiện tại: $(pwd)"
                exit 1
              fi
            fi
            
            echo "📂 Đang làm việc tại thư mục: $(pwd)"
            
            # Kéo code mới nhất từ nhánh main
            git pull origin main
            
            # Build lại image và cập nhật containers
            docker compose up -d --build
            
            # Đợi container web sẵn sàng (tránh lỗi OCI procReady race condition khi exec tức thì)
            echo "⏳ Đang đợi container web khởi động và sẵn sàng..."
            for i in $(seq 1 15); do
              STATUS=$(docker inspect --format='{{.State.Status}}' dailydictation_web 2>/dev/null || true)
              if [ "$STATUS" = "running" ]; then
                echo "🟢 Container dailydictation_web đang ở trạng thái: running"
                break
              fi
              echo "⏳ Trạng thái container: ${STATUS:-khởi tạo}. Đợi thêm 2s (lần $i/15)..."
              sleep 2
            done
            sleep 4
            
            # Chạy migration database (retry tối đa 10 lần)
            echo "🔄 Bắt đầu chạy database migration..."
            MIGRATION_OK=0
            for i in $(seq 1 10); do
              if docker compose exec -T web python -m app.infrastructure.database.migrate; then
                MIGRATION_OK=1
                echo "✅ Migration database hoàn tất thành công!"
                break
              else
                echo "⚠️ Container web chưa sẵn sàng nhận lệnh exec (thử lại lần $i/10 sau 3s)..."
                sleep 3
              fi
            done

            if [ "$MIGRATION_OK" -ne 1 ]; then
              echo "❌ Lỗi: Chạy migration database thất bại sau 10 lần thử!"
              echo "📋 Log gần nhất của web container:"
              docker compose logs --tail=100 web
              exit 1
            fi
            
            # Dọn dẹp images cũ không còn dùng để giải phóng ổ cứng VPS
            docker image prune -f
            
            echo "✅ [CI/CD] Deploy và cập nhật Database hoàn tất thành công!"
