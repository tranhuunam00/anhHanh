services:
  db:
    image: postgres:16-alpine
    container_name: dailydictation_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dailydictation
    ports:
      - "${DB_PORT:-5444}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dailydictation"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-58-43Z
    container_name: dailydictation_minio
    restart: always
    command: server /data --address ":9100" --console-address ":9101"
    ports:
      - "${MINIO_PORT:-9100}:9100"
      - "${MINIO_CONSOLE_PORT:-9101}:9101"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9100/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: dailydictation_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9100 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      /usr/bin/mc mb --ignore-existing myminio/feedback-images;
      /usr/bin/mc anonymous set download myminio/feedback-images;
      echo 'MinIO bucket feedback-images initialized with public download policy!';
      exit 0;
      "

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dailydictation_web
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5100}:5100"
    environment:
      - PORT=${PORT:-5100}
      - HOST=${HOST:-0.0.0.0}
      - RUNNING_IN_DOCKER=1
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/dailydictation}
      - ADMIN_EMAIL_ADDRESS=${ADMIN_EMAIL_ADDRESS}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_MAILER_CLIENT_ID=${GOOGLE_MAILER_CLIENT_ID}
      - GOOGLE_MAILER_CLIENT_SECRET=${GOOGLE_MAILER_CLIENT_SECRET}
      - GOOGLE_MAILER_REFRESH_TOKEN=${GOOGLE_MAILER_REFRESH_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - YOUTUBE_PROXY=${YOUTUBE_PROXY:-}
      - YOUTUBE_COOKIE_FILE=${YOUTUBE_COOKIE_FILE:-/app/data/cookies.txt}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9100}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin123}}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-feedback-images}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - app_data:/app/data

volumes:
  pgdata:
  miniodata:
  app_data:
